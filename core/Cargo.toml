[package]
name = "sdr_core"
version = "0.1.0"
edition = "2021"
description = "SDR Studio core engine — DSP/FFT/waterfall (Rust). Prototype stage: FFI bridge validation."

[lib]
name = "sdr_core"
# cdylib = biblioteca dinâmica (.dll no Windows, .so no Linux, .dylib no macOS)
# chamável de fora do Rust — é essa a peça que o Dart/Flutter vai carregar.
crate-type = ["cdylib"]

[profile.dev]
opt-level = 0
