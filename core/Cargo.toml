[package]
name = "sdr_core"
version = "0.1.0"
edition = "2021"
description = "SDR Studio core engine — DSP/FFT/waterfall + biblioteca de frequências (Rust)."
build = "build.rs"

[lib]
name = "sdr_core"
crate-type = ["cdylib"]

[build-dependencies]
cc = "1"

[dependencies]
rustfft = "6"
rusqlite = { version = "0.31", features = ["bundled"] }

# Usados só para serializar a lista de frequências como JSON, que o Dart
# já sabe ler nativamente (dart:convert) sem precisar de pacote extra.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
