name: sdr_studio
description: SDR Studio — plataforma SDR multiplataforma.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  ffi: ^2.1.0
  # IBM Plex Sans (texto/UI) + IBM Plex Mono (números que mudam em tempo
  # real — frequência, dB). Baixado uma vez do Google Fonts e cacheado
  # localmente pelo pacote; requer internet na primeira execução.
  google_fonts: ^6.2.1
  flutter_soloud: ^4.0.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
